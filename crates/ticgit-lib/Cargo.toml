[package]
name = "ticgit-lib"
description = "Ticket-tracking metadata stored via git-meta"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
include = [
    "src/**",
    "Cargo.toml",
    "../../README.md",
    "../../LICENSE",
]

[dependencies]
# `internal` exposes git-meta's tree parser and store, which the additive
# reindex uses to read the remote tracking tree and apply single keys.
git-meta-lib = { workspace = true, features = ["internal"] }
gix          = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
time         = { workspace = true }
uuid         = { workspace = true }
sha2         = { workspace = true }
hex          = { workspace = true }
tempfile     = { workspace = true }

[features]
default = []
# Re-export the `test_support` module so downstream crates (the CLI's
# integration tests) can spin up isolated stores.
test-support = []

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
